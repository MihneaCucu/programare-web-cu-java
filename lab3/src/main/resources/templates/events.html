
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event Planner</title>
</head>
<body>

<h1>Event Planner</h1>
<h2>Upcoming Events</h2>
<a th:href="@{/events/new}">Add New Event</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
    </tr>
    </thead>


    <tbody>
    <tr th:each="event : ${events}">
        <td th:text="${event.id}"></td>
        <td th:text="${event.name}"></td>
        <td th:text="${event.category}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
